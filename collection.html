<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Twenty Ways of Looking at a Tap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Comic Neue', 'Quicksand', 'Comic Sans MS', cursive, sans-serif;
      max-width: 780px;
      margin: 0 auto;
      padding: 30px 20px;
      color: #f5ecd7;
      background-color: #3b2417;
      background-image: radial-gradient(#f5e6a8 2.5px, transparent 2.5px);
      background-size: 28px 28px;
      background-attachment: fixed;
    }
    h1 {
      font-family: 'Quicksand', 'Comic Neue', cursive, sans-serif;
      font-size: 1.8em;
      font-weight: 600;
      border-bottom: 2px dashed #f5e6a8;
      padding-bottom: 15px;
      color: #f5e6a8;
      letter-spacing: 0.5px;
    }
    .intro {
      color: #d4b896;
      font-style: italic;
      margin-bottom: 30px;
      font-size: 1.05em;
    }
    .record {
      background: #4a2f1e;
      margin: 25px 0;
      padding: 18px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      border: 1px solid #6b4a30;
    }
    .record h3 {
      margin: 0 0 6px 0;
      font-size: 1.15em;
      color: #f5e6a8;
      font-weight: 700;
    }
    .meta {
      color: #c4a882;
      font-size: 0.9em;
      margin-bottom: 12px;
    }
    .record img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      display: block;
    }
    .record audio {
      width: 100%;
      margin: 8px 0;
    }
    .record pre {
      background: #2e1c11;
      padding: 12px;
      border-radius: 10px;
      white-space: pre-wrap;
      font-family: 'Comic Neue', 'Quicksand', cursive, sans-serif;
      font-size: 0.95em;
      line-height: 1.6;
      color: #f0e2c8;
    }
    .not-captured {
      background: #5c3a22;
      padding: 10px 14px;
      border-left: 4px solid #f5e6a8;
      border-radius: 8px;
      margin-top: 12px;
      font-size: 0.9em;
      color: #f5ecd7;
    }
    .not-captured strong {
      color: #f5e6a8;
    }
    .certainty {
      font-size: 0.85em;
      color: #c4a882;
    }
  </style>
</head>
<body>
  <h1>Twenty Ways of Looking at a Tap</h1>
  <p class="intro">Twenty encounters with one object, recorded over five days.</p>
  <div id="records"></div>

  <script>
    fetch('records.json')
      .then(r => r.json())
      .then(data => {
        const container = document.getElementById('records');
        data.records.forEach(rec => {
          const div = document.createElement('div');
          div.className = 'record';

          let media = '';
          if (rec.type === 'image') {
            media = `<img src="${rec.file}" alt="${rec.title}">`;
          } else if (rec.type === 'sound') {
            media = `<audio controls src="${rec.file}"></audio>`;
          } else if (rec.type === 'text') {
            media = `<pre id="text-${rec.id}">Loading...</pre>`;
          }

          div.innerHTML = `
            <h3>${rec.title}</h3>
            <div class="meta">${rec.date} · ${rec.place} · ${rec.recorder} · <span class="certainty">certainty ${rec.certainty}/5</span></div>
            ${media}
            <div class="not-captured"><strong>Not captured:</strong> ${rec.not_captured}</div>
          `;
          container.appendChild(div);

          if (rec.type === 'text') {
            fetch(rec.file)
              .then(r => r.text())
              .then(t => {
                document.getElementById(`text-${rec.id}`).textContent = t;
              });
          }
        });
      });
  </script>
</body>
</html>
